# d-pg -e POSTGRES_PASSWORD=docker -e POSTGRES_USER=docker -e POSTGRE
# S_DB=apisolid -d postgres

services:
  api-solid-pg:
    image: postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_PASSWORD=docker
      - POSTGRES_USER=docker
      - POSTGRES_DB=apisolid